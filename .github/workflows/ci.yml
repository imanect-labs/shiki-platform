name: CI

on:
  pull_request:
    # docs のみの変更で重量 CI（Rust フルビルド×複数ジョブ・compose）を回さない。
    # file-size ゲートは *.rs のみ対象（scripts/check-file-size.sh）のため取りこぼしは無い。
    # .md を外すのは最上位だけ。crates/ の下の .md は include_str! でコンパイルに入るものがある
    # （crates/chat/src/worker/yui_guide.md）ので回す（どのテストを回すかは changes ジョブが選ぶ）。
    # ブランチ保護の required checks は未設定なので pending 固着も起きない。
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".claude/**"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
      - ".claude/**"

concurrency:
  group: ci-${{ github.ref }}
  # PR は新しい push で古い run を止める。main は止めない: rust-cache を保存するのは main だけ
  # （下記 save-if）で、キャンセルされた run は保存しないため、連続 push で main のキャッシュが
  # 一度も更新されなくなる（#920）。保留中の run は GitHub が 1 本しか保たないので溜まりはしない。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 既定の GITHUB_TOKEN を最小権限に絞る（各ジョブで必要に応じて昇格する）。
permissions:
  contents: read

env:
  # crates.io / GitHub への一時的なネットワーク断で CI を落とさない（flake 実績あり）。
  CARGO_NET_RETRY: "10"
  # GHA ランナー → crates.io の HTTP/2 は「Error in the HTTP2 framing layer」で落ちる実績
  # （CARGO_NET_RETRY では救えない）。HTTP/1.1 に固定する定番回避策。ダウンロードは
  # rust-cache が効くため直列化の影響は小さい。
  CARGO_HTTP_MULTIPLEXING: "false"
  # debuginfo の削減（行テーブルのみ・依存は 0）は Cargo.toml の [profile.dev] へ移した。
  # ここに env で置くと CI にしか効かず、ローカルだけフル debuginfo で target/ が
  # 100GB 超に膨らんでいた（#419）。設定はマニフェスト側の 1 箇所に集約する。
  # 増分コンパイルは CI（毎回クリーン相当・rust-cache 復元）では利得がなくオーバーヘッド。
  CARGO_INCREMENTAL: "0"

jobs:
  # PR の変更ファイルから、回すジョブと Rust テストの対象を選ぶ（#921・scripts/ci-select.py）。
  # 関係ない変更で全テストを回さない。判定できないパス・依存グラフや CI 自体の変更は全量に倒し、
  # 認可・テナント越境の脅威テストは Rust の変更があれば選択に関係なく coverage ジョブで回す（結合テストの
  # 環境があるのは coverage ジョブだけ）。main への push は常に全量（取りこぼしは main で検知して選択規則を直す）。
  # E2E は担当シナリオ対応表（ci/scenarios.toml）で spec を選ぶ（#922）。
  changes:
    name: 変更から回すジョブ・テストを選ぶ
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.select.outputs.full }}
      rust: ${{ steps.select.outputs.rust }}
      web: ${{ steps.select.outputs.web }}
      python: ${{ steps.select.outputs.python }}
      compose: ${{ steps.select.outputs.compose }}
      nextest_filter: ${{ steps.select.outputs.nextest_filter }}
      cargo_packages: ${{ steps.select.outputs.cargo_packages }}
      always_run_tests: ${{ steps.select.outputs.always_run_tests }}
      e2e_args: ${{ steps.select.outputs.e2e_args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR はマージコミット（HEAD^1 = base の先端・HEAD^2 = PR の先端）と比べるので親まで取る。
          # main への push は、まとめて push されたコミットの前（github.event.before）まで遡れるよう深めに取る。
          fetch-depth: ${{ github.event_name == 'push' && 20 || 2 }}
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python3 scripts/ci-select.py select --base HEAD^1 --head HEAD
          else
            python3 scripts/ci-select.py select --full
            # main で落ちたテストが PR で選ばれていたかを selection-gap ジョブで突き合わせるため、この変更を
            # PR として選んだ結果を残す。push 前の先端（before）からの差分で、取れなければ HEAD^1（squash マージ）。
            base=HEAD^1
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then base=$BEFORE; fi
            python3 scripts/ci-select.py select --base "$base" --head HEAD --github-output "" --summary "" \
              --json pr-selection.json \
              || echo "::warning::PR としての選択を出せなかった（selection-gap は突き合わせない）"
          fi
      - name: upload PR-equivalent selection (main)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-selection
          path: pr-selection.json
          if-no-files-found: ignore
          retention-days: 7

  rust:
    name: Rust (fmt / clippy / test / build)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # フルワークスペースの target + rust-cache 復元でランナー既定 14GB を使い切る実績
      # （No space left on device で突然死）があるため、不要プリインストールを先に消す。
      - name: free disk space (不要プリインストール削除)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.96.0"
          components: rustfmt, clippy
      # キャッシュはリポジトリ全体で 10GB。超えると古いものから消され、全ジョブが毎回 cold
      # ビルドになっていた（#920）。保存は main だけにし、PR は main のキャッシュを読むだけにする
      # （PR の保存は refs/pull/N/merge スコープで他の PR・main から使えないのに枠だけ食う）。
      # 保存するのは依存だけなので、テストが落ちても保存する（main の flake で更新が止まらないように）。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # nextest はテストバイナリを跨いで並列実行し cargo test より速い（本ジョブは compose
      # 非依存＝env-gate の IT はスキップされ実質ユニットのみ・DB 競合なし）。doctest は
      # nextest 非対応だが coverage ジョブの `cargo llvm-cov --all` 側で実行される。
      # clippy --all-targets が全ターゲットの型検査を兼ねるため `cargo build --all` は廃止。
      # テストは changes ジョブが選んだもの（変更したクレート＋依存するクレート＋常に回す脅威テスト・
      # 全量なら all()）。clippy は選択せず全体を見る（型の不整合は依存元から伝わるため）。
      - name: cargo nextest run (選択したテスト)
        env:
          FILTER: ${{ needs.changes.outputs.nextest_filter }}
        # --no-fail-fast: 落ちたテストをすべて JUnit に残す（main の selection-gap が突き合わせる）。
        run: cargo nextest run --workspace --all-features --no-tests=warn --no-fail-fast -E "$FILTER"
      # main で落ちたテストを selection-gap ジョブへ渡す（JUnit は .config/nextest.toml で出す）。
      - name: upload failed tests (main)
        if: failure() && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failures-rust
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  # shiki-server の release バイナリを 1 回だけビルドして compose ジョブ（smoke / web-e2e）へ
  # artifact 共有する。以前は各 compose ジョブが Docker 内で cargo フルビルドしており、
  # エフェメラルランナーではキャッシュが効かず（`RUN --mount=type=cache` が毎回空）、
  # 各 10 分超＋crates.io ダウンロード flake の源だった。
  build-server:
    name: Build shiki-server (release・compose ジョブ共有)
    needs: [changes]
    if: needs.changes.outputs.compose == 'true'
    # deploy/Dockerfile.ci（ubuntu:24.04）と glibc を一致させるため 24.04 に固定する。
    # ubuntu-latest が 26.04 へ進んだら Dockerfile.ci と同時に上げること。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: free disk space (不要プリインストール削除)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # release プロファイル専用キャッシュ（debug 系ジョブと混ぜて肥大化させない）。
          shared-key: release-server
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # CI 用に release ビルドを高速化する（compose smoke / web-e2e 用バイナリ・実行時の
      # 微差は許容）。codegen-units を上げて並列コード生成・opt-level=2 でコンパイル短縮。
      - run: cargo build --release --bin shiki-server
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shiki-server-bin
          path: target/release/shiki-server
          if-no-files-found: error
          retention-days: 1

  quality:
    name: Quality gates (file-size / migration-version / cargo-machete)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GITHUB_TOKEN を .git/config に残さない（後続サードパーティ処理からの窃取防止）。
          persist-credentials: false
      # 巨大ファイル gate は toolchain 不要（bash+git のみ）。最速で fail-fast させる。
      - name: file-size gate (1 ファイル 1000 行以内)
        run: bash scripts/check-file-size.sh
      # migration の番号衝突は並行 PR のマージ順で構造的に起こり、**新規 DB でだけ**壊れる
      # （既存 DB は増分適用済みで露見しない）。結合テストは DB env 未設定でスキップされるため
      # CI で拾えなかった実績があるので、ファイル名だけで判定できるここで止める（#413）。
      - name: migration version gate (バージョン番号の重複禁止)
        run: bash scripts/check-migration-versions.sh
      # プール分割（data-platform §12 第 2 段）を壊す書き方を字句で止める（Task 15.1）。
      # SQL リテラル単位の検査は crates/data/tests/shard_safety_lint.rs（cargo test）が担う。
      - name: shard-safety gate (PgPool 直参照・シーケンス直呼びの禁止)
        run: bash scripts/check-shard-safety.sh
      # 同じく CI で拾えない構造的バグ（#453）。CI は全サービスをまとめて起動せず必要な
      # ものだけ名指しで起動するため、ホストポートの二重 publish が衝突する組み合わせは
      # 一度も同時に立ち上がらない。ローカルの `docker compose up` だけが壊れる。
      - name: compose port gate (ホストポートの二重 publish 禁止)
        run: bash scripts/check-compose-ports.sh
      # テストの選択（changes ジョブ）を誤ると必要なテストが黙って回らなくなるので、選択規則を検査する。
      - name: test selector (scripts/ci-select.py の検査)
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      # E2E の担当シナリオ対応表（ci/scenarios.toml）と ALWAYS_RUN の更新忘れを落とす（#922）。spec・ページ・
      # クレートを足して載せ忘れると、エラー文言がどこに何を足すかを示す。
      - name: test selection tables (対応表・ALWAYS_RUN の更新漏れ)
        run: python3 scripts/ci-select.py check
      # machete はソースを字句で読むだけでビルドも依存の取得もしないため rust-cache は持たない
      # （10GB の枠を空けるため・#920）。
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.96.0"
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-machete
      - name: cargo machete (未使用依存の検出)
        # 所有フォーク vendor/ は独自ワークスペースで machete が解決できないため、自作の crates/ のみ対象にする。
        run: cargo machete crates

  cargo-deny:
    name: cargo-deny (advisories / licenses / bans / sources)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GITHUB_TOKEN を .git/config に残さない（後続サードパーティ処理からの窃取防止）。
          persist-credentials: false
      # EmbarkStudios/cargo-deny-action@v2 は内部で `--log-level warn` を渡すが、
      # 新しい cargo-deny CLI はこれを廃止したため `unrecognized subcommand 'warn'` で全 PR が赤化する。
      # cargo-machete と同じく taiki-e/install-action でバイナリを入れ、引数を自分で制御する。
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.96.0"
      # cargo-deny はビルドしない（cargo metadata 用のレジストリだけ要る）ので target は持たない。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-targets: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
      - name: cargo deny check (advisories / licenses / bans / sources)
        run: cargo deny --all-features check

  # CSV クエリサービスの隔離 DuckDB ランナー（Task 11P.7・PIT-39）。DuckDB（bundled C++）を
  # 含む workspace 除外クレートを専用ジョブでビルドし、外部パス/URL 参照・DML/DDL・
  # クォータ超過の adversarial テストを走らせる（メイン rust ジョブに DuckDB を混ぜない）。
  tabular-runner:
    name: Tabular runner (隔離 DuckDB・PIT-39 adversarial)
    # compose（smoke / E2E）のイメージにランナーを焼くので、compose を回すときも要る。
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.compose == 'true'
    # runtime-only イメージ（ubuntu:24.04）と glibc を一致させるため 24.04 固定。
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: free disk space (不要プリインストール削除)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.96.0"
      # 除外クレート（別 target）とメイン target を別々にキャッシュする。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            crates/tabular/runner
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fmt / clippy (runner)
        run: |
          cargo fmt --manifest-path crates/tabular/runner/Cargo.toml --check
          cargo clippy --manifest-path crates/tabular/runner/Cargo.toml --release -- -D warnings
      # 隔離ランナー（DuckDB bundled）を release ビルドする。
      - name: build isolated runner (bundled DuckDB)
        run: cargo build --manifest-path crates/tabular/runner/Cargo.toml --release
      # adversarial テスト（PIT-39 の 4 系統）を実行する。ランナーは SHIKI_TABULAR_RUNNER で指す。
      - name: adversarial tests (外部参照/DML/DDL/クォータ超過の拒否)
        env:
          SHIKI_TABULAR_RUNNER: crates/tabular/runner/target/release/shiki-tabular-runner
        run: cargo test -p shiki-tabular --test runner_adversarial_it
      # E2E の runtime-only イメージへ焼くため、ビルド済みランナーを artifact 共有する。
      - name: upload runner binary (web-e2e 用)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shiki-tabular-runner-bin
          path: crates/tabular/runner/target/release/shiki-tabular-runner
          if-no-files-found: error
          retention-days: 1

  # gVisor 既定ティア（#346）の gated IT。GHA ランナーで runsc（rootless・systrap・KVM 不要）を
  # 実際に回し、rootfs 同梱の numpy/pandas import・shell・メモリ watchdog を検証する。
  # ランナー環境（AppArmor の非特権 userns 制限等）に依存するため、安定を確認するまで
  # **非ブロッキング**（continue-on-error）。required 化は安定後に外す。
  sandbox-gvisor:
    name: Sandbox gVisor IT (runsc・非ブロッキング)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    continue-on-error: true
    steps:
      # サードパーティ処理（runsc 取得・docker build・pip）を含むためトークンを残さない。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: free disk space (不要プリインストール削除)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      # Ubuntu 24.04 は AppArmor が非特権 userns 生成を制限するため解除する（runsc --rootless 前提）。
      - name: allow unprivileged userns (AppArmor)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fetch runsc (manifest 検証・PIT-33)
        run: bash scripts/fetch-native-assets.sh
      - name: build rootfs (numpy/pandas 同梱・--require-hashes)
        run: bash scripts/build-sandbox-rootfs.sh
      - name: gvisor gated IT (create/exec/numpy/watchdog)
        env:
          SANDBOX_GVISOR_IT: "1"
          RUNSC_BIN: ${{ github.workspace }}/deploy/sandbox-assets/bin/runsc
          GVISOR_ROOTFS: ${{ github.workspace }}/deploy/sandbox-assets/rootfs
        run: cargo test -p shiki-sandbox-orchestrator --test gvisor_it -- --test-threads=1

  python:
    name: Python (ingestion-worker ruff / pytest)
    needs: [changes]
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ingestion-worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Takumi Guard: uv sync 前に PyPI プロキシを設定（匿名＝ブロックのみ）。
      - uses: flatt-security/setup-takumi-guard-pypi@a01b3b2a6436d3df60d4e29c805ad83a704aadc5 # v1.3.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "ingestion-worker/uv.lock"
      - name: uv sync
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check .
      # 高速テストのみ（フェイクモデル）。Docling 実走・実モデルは slow マークで除外し、
      # compose 検証とローカルで担保する（CI 予算・モデル DL 回避）。
      - name: pytest (fast)
        run: uv run pytest -m "not slow" -q

  # main は全テストを計測して全体の行カバレッジ 80% で判定する。PR は changes ジョブが選んだテストだけを
  # 計測し、**変更した行**のカバレッジ 80% で判定する（全体の数値は選んだテストだけの値になり意味が無いため・
  # #921 の human 決定）。
  coverage:
    name: Coverage (cargo-llvm-cov, gate 80%)
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # カバレッジ表を PR にコメントするため pull-requests:write を昇格付与する。
    permissions:
      contents: read
      pull-requests: write
    env:
      # 除外: バイナリ entrypoint（配線のみ）・vendor（所有フォーク）・実 sidecar 駆動の I/O 境界
      # （sandbox の wasm backend / gRPC client は実 V8/Pyodide を要し gated IT `SANDBOX_IT=1` で検証・CI 分母外）
      COV_IGNORE: 'src/(bin/|main\.rs)|/examples/|vendor/(secure-exec|openjtd)/|sandbox-orchestrator/src/backend/wasm/|sandbox-orchestrator/src/backend/(gvisor|firecracker)/(instance|mod)\.rs|sandbox-guest-agent/src/vsock\.rs|sandbox-netns/src/lib\.rs|sandbox-client/src/client\.rs'
      IS_PR: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GITHUB_TOKEN を .git/config に残さない（このジョブは依存の build.rs や結合テストを動かす。
          # PR へのコメントは GH_TOKEN を env で渡すので不要）。
          persist-credentials: false
          # 変更行カバレッジは PR のマージコミットと base（HEAD^1）の差分で取る。
          fetch-depth: 2
      # llvm-cov target ＋ compose ボリュームでディスクが逼迫するため先に解放する。
      - name: free disk space (不要プリインストール削除)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.96.0"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # flake で失敗しても計装ビルドのキャッシュを保存する（保存しないと次回も cold で遅い）。
          # coverage flake（emit_workflow_it 等）が cache 温存を妨げていた根本対策。
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-llvm-cov
      # live 依存（OpenFGA / Redis）を起動し、結合テストのカバレッジも算入する。
      # これにより fga_http / client（OpenFGA 経路）と redis_store（Redis 経路）も
      # 単体テストでは届かない実経路をカバーした上で全体カバレッジを評価する。
      # 起動（pull ＋ healthcheck 待ち）は llvm-cov clean と独立なので background で並列化。
      - name: compose up (postgres + rustfs + openfga + redis + qdrant → healthy 待ち)
        id: compose-up
        background: true
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          docker compose up -d postgres rustfs openfga redis qdrant
          for svc in postgres rustfs openfga redis qdrant; do
            ok=""
            for i in $(seq 1 60); do
              s=$(docker compose ps "$svc" --format '{{.Health}}' || true)
              echo "[$svc] attempt $i: health=$s"
              [ "$s" = "healthy" ] && { ok=1; break; }
              sleep 5
            done
            [ -n "$ok" ] || { echo "$svc が healthy になりませんでした"; exit 1; }
          done
      # --no-report は llvm-cov 標準のクリーンアップを抑止するため、rust-cache が復元した
      # 過去の profraw/profdata が混入し得る。計測前に明示的に掃除して当該 run のみを反映させる。
      - name: clean stale coverage artifacts
        run: cargo llvm-cov clean --workspace
      - name: wait for services healthy
        wait: compose-up
      # 単体＋結合テストをまとめて計測（各 *_TEST_* env を見て結合テストが実走する）。
      # storage の結合テストは postgres + rustfs + openfga 実体を使う（presigned/closure/監査を実経路で検証）。
      - name: test + coverage (cargo-llvm-cov)
        env:
          OPENFGA_TEST_URL: http://localhost:8082
          REDIS_TEST_URL: redis://localhost:6379
          STORAGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shiki
          STORAGE_TEST_S3_ENDPOINT: http://localhost:9000
          RAG_TEST_QDRANT_URL: http://localhost:6333
          # compose の Qdrant は API キー付き（.env.example の dev 値・#812）。
          RAG_TEST_QDRANT_API_KEY: shiki-qdrant-dev-key
          FULL: ${{ needs.changes.outputs.full }}
          CARGO_PACKAGES: ${{ needs.changes.outputs.cargo_packages }}
          ALWAYS_RUN_TESTS: ${{ needs.changes.outputs.always_run_tests }}
        # coverage は cargo test（バイナリ逐次＝in-process 共有 fixture が壊れない安全な実行
        # モデル）のまま。nextest はプロセス毎実行で in-process 共有状態に依存する IT を壊す
        # 実績があり不採用。速度は debuginfo 削減の計装ビルド短縮＋cache-on-failure で稼ぐ。
        # ログは main で落ちたテストを selection-gap ジョブへ渡すために残す（`to rerun pass -p …` の行）。
        # shell 未指定の run は `bash -e` で pipefail が無く、`| tee` が失敗を握りつぶすので明示する。
        # 全量（main）は --no-fail-fast で落ちたテストをすべて記録する（selection-gap の突き合わせ用）。
        run: |
          set -o pipefail
          run_tests() {
            if [ "$FULL" = "true" ]; then
              cargo llvm-cov --all --no-report --no-fail-fast
              return
            fi
            # 変更したクレート＋依存するクレートのテスト（-p は changes ジョブが組んだもの・語分割させる）。
            # shellcheck disable=SC2086
            cargo llvm-cov --no-report $CARGO_PACKAGES || return
            # 常に回す脅威テストは 1 回の起動でまとめて回す。パッケージごとに `-p` で起動すると依存の
            # フィーチャ集合が変わり、計装ビルドが何度もやり直しになる（--workspace なら main と同じ）。
            # shellcheck disable=SC2086
            cargo llvm-cov --no-report --workspace $ALWAYS_RUN_TESTS
          }
          run_tests 2>&1 | tee cargo-test.log
      - name: upload failed tests (main)
        if: failure() && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failures-coverage
          path: cargo-test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: coverage report (lcov + summary + job summary)
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex "$COV_IGNORE"
          # サマリ表を再利用するためファイルに保存（Job Summary と PR コメントの両方で使う）。
          cargo llvm-cov report --summary-only --ignore-filename-regex "$COV_IGNORE" | tee coverage-summary.txt
          {
            echo '### Rust test coverage'
            echo '```'
            cat coverage-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # PR の判定に使う変更行カバレッジ。閾値の判定は PR へのコメントの後（下の gate）で行う。
      - name: "diff coverage (PR: 変更した行)"
        if: env.IS_PR == 'true'
        run: |
          status=0
          python3 scripts/ci-select.py diff-coverage --lcov lcov.info --ignore "$COV_IGNORE" --min 80 \
            --output diff-coverage.md || status=$?
          echo "$status" > diff-coverage.status
          cat diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
      # カバレッジ表を PR にコメントする（マーカーで既存コメントを更新＝スティッキー）。
      # ゲート fail 時も結果が見えるよう always() で実行する。push(main) では PR が無いのでスキップ。
      - name: comment coverage table on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          [ -f coverage-summary.txt ] || { echo "サマリ未生成のためスキップ"; exit 0; }
          marker='<!-- coverage-report -->'
          total_line=$(grep '^TOTAL' coverage-summary.txt || true)
          # PR の判定は変更行カバレッジ。全体の数値は、テストを選んだ run では選んだテストだけの値なので参考にとどめる。
          header() {
            echo "$marker"
            echo '## 📊 Rust test coverage'
            echo "PR の閾値ゲート: **変更した行**の **80%** 以上（全体の 80% ゲートは main で判定）"
            echo
            if [ -f diff-coverage.md ]; then cat diff-coverage.md; else echo '変更行カバレッジは未計測です。'; fi
            echo
            if [ -n "$total_line" ]; then
              if [ "$FULL" = "true" ]; then echo '全体（全テスト）:'; else echo '全体（参考・選んだテストだけの値）:'; fi
              echo '```'
              echo "$total_line"
              echo '```'
            fi
          }
          {
            header
            echo '<details>'
            echo '<summary>ファイル別内訳を表示</summary>'
            echo
            echo '```'
            cat coverage-summary.txt
            echo '```'
            echo '</details>'
          } > body.md
          # ファイル別内訳はファイル数に比例して大きくなる。コメント本文の上限（65,536 字）を超えるなら内訳を省き、
          # 本文は引数ではなくファイルで渡す（大きな本文で「Argument list too long」にならない）。
          if [ "$(wc -c < body.md)" -gt 60000 ]; then
            {
              header
              echo
              echo 'ファイル別内訳はコメントの上限を超えるため省略しました（Coverage ジョブのログを参照）。'
            } > body.md
          fi
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" \
            --jq "[.[] | select(.user.login==\"github-actions[bot]\" and (.body | startswith(\"${marker}\")))] | last | .id")
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -X PATCH -F body=@body.md >/dev/null
            echo "既存コメントを更新: $existing"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" -F body=@body.md >/dev/null
            echo "新規コメントを作成"
          fi
      # main: 全体カバレッジ 80% の絶対床ゲート。下回ったら CI を fail させる（カバレッジを下げない）。
      # コメント投稿後に判定する（fail 時もコメントは投稿済み）。
      - name: "coverage gate (main: 全体の 80%)"
        if: env.IS_PR != 'true'
        run: cargo llvm-cov report --fail-under-lines 80 --ignore-filename-regex "$COV_IGNORE"
      # PR: 変更した行の 80%（未達の行はコメントと Job Summary に出ている）。
      - name: "coverage gate (PR: 変更した行の 80%)"
        if: env.IS_PR == 'true'
        run: |
          status=$(cat diff-coverage.status)
          [ "$status" = "0" ] || { echo "変更した行のカバレッジが 80% 未満です（diff-coverage.md 参照）"; exit 1; }
      - name: upload coverage (lcov)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 7
      - name: dump compose logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color | tail -200

  # 構造化データの行述語の脅威モデルを、読取の全戦略（強制・O3 の交差駆動とバッチ駆動を含む）と
  # O2（統計を作ってからコストで選ぶ）と本体経路（v1・機能フラグ）で回し直す
  # （Task 15.3 / 15.12・PIT-76: コストモデルは速さにだけ効き、結果と認可には効かない）。
  # 以前は coverage ジョブの中で計装なしの cargo test を 10 回回しており、計装ビルドと別の
  # ビルドが要る分も含めて timeout-minutes: 40 を超える恐れがあった（監査 B1-14）。
  # 別ジョブにしてテストバイナリを 1 回だけビルドし、同じバイナリを変種ごとに実行する。
  data-strategies:
    name: Data (policy_threat_it × read strategies)
    # 行述語の脅威モデル（認可）なので、Rust の変更があれば選択に関係なく回す。
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: free disk space (不要プリインストール削除)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.96.0"
      # rust ジョブのキャッシュは共有しない: rust は --workspace、ここは -p shiki-data で依存の
      # フィーチャ集合が変わり（uuid の v5・reqwest の stream 等）、sqlx 系が作り直しになる。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # ビルドと compose の起動（pull ＋ healthcheck 待ち）は独立なので background で並列化する。
      - name: compose up (postgres + openfga → healthy 待ち)
        id: compose-up
        background: true
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          docker compose up -d postgres openfga
          for svc in postgres openfga; do
            ok=""
            for i in $(seq 1 60); do
              s=$(docker compose ps "$svc" --format '{{.Health}}' || true)
              echo "[$svc] attempt $i: health=$s"
              [ "$s" = "healthy" ] && { ok=1; break; }
              sleep 5
            done
            [ -n "$ok" ] || { echo "$svc が healthy になりませんでした"; exit 1; }
          done
      - name: build policy_threat_it (1 回だけ)
        run: cargo test -p shiki-data --all-features --test policy_threat_it --no-run
      - name: wait for services healthy
        wait: compose-up
      - name: policy_threat_it under every read strategy (data)
        env:
          OPENFGA_TEST_URL: http://localhost:8082
          STORAGE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/shiki
        run: |
          for v in SHIKI_DATA_READ_PATH=body SHIKI_DATA_FORCE_STRATEGY=sort \
                   SHIKI_DATA_FORCE_STRATEGY=filter SHIKI_DATA_FORCE_STRATEGY=policy \
                   SHIKI_DATA_FORCE_STRATEGY=union SHIKI_DATA_FORCE_STRATEGY=safe \
                   SHIKI_DATA_FORCE_STRATEGY=intersect SHIKI_DATA_FORCE_STRATEGY=batch \
                   SHIKI_DATA_ANALYZE_ON_READ=1 SHIKI_DATA_SORT_BUDGET=1; do
            echo "== $v"
            env "$v" cargo test -p shiki-data --all-features --test policy_threat_it
          done
      - name: dump compose logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color | tail -200

  # Rust 定義からの型生成（gen:api）を 1 回だけ回し、web と web-e2e へ artifact で配る。
  # 以前は web と web-e2e がそれぞれ同じビルド（Rust 5 バイナリ）を回し、web-e2e の分が
  # 最長経路に 8〜12 分乗っていた（#920）。lint と切り離すので、lint が落ちても E2E は走る。
  gen-api:
    name: gen:api (Rust 定義から型生成)
    needs: [changes]
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Takumi Guard: pnpm install 前に npm プロキシを設定（匿名＝ブロックのみ）。
      # リポジトリの .npmrc に registry はあるが、Action がジョブ全体の userconfig も揃える。
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.96.0"
      # images.yml の web イメージの gen:api も同じ shared-key を読むだけで使う
      # （同じ依存を 2 本保存しない・#920）。
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: gen-api
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: gen:api (Rust 定義から型生成)
        working-directory: web
        run: pnpm gen:api
      - name: upload generated types (web / web-e2e 用)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-generated
          path: web/src/generated
          if-no-files-found: error
          retention-days: 1

  web:
    name: Web (lint / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, gen-api]
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Takumi Guard: pnpm install 前に npm プロキシを設定（匿名＝ブロックのみ）。
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install
        working-directory: web
        run: pnpm install --frozen-lockfile
      # チャットの ```ui の説明（crates/chat/src/worker/yui_reference.json）は @imanect/yui から
      # 生成して commit する。依存を上げて作り直し忘れたら落とす（手書きの説明に戻さない）。
      - name: gen:yui が最新か
        working-directory: web
        run: |
          pnpm gen:yui
          git diff --exit-code -- ../crates/chat/src/worker/yui_reference.json \
            || { echo "::error::yui_reference.json が古い。cd web && pnpm gen:yui で作り直して commit する"; exit 1; }
      - name: download generated types (gen-api ジョブの成果物)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-generated
          path: web/src/generated
      - name: lint
        working-directory: web
        run: pnpm lint
      # `pnpm build` は prebuild で gen:api（cargo）を回してしまうため、next build を直接呼ぶ
      # （このジョブには Rust ツールチェーンもキャッシュも無い。生成物は上で受け取り済み）。
      - name: build
        working-directory: web
        run: pnpm exec next build

  compose-smoke:
    name: compose smoke (/healthz, /me, skillex)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, build-server, tabular-runner]
    if: needs.changes.outputs.compose == 'true'
    env:
      # shiki-server はビルド済みバイナリの runtime-only イメージ（CI override）を使う。
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: download shiki-server binary (build-server の成果物)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shiki-server-bin
          path: deploy/compose/prebuilt
      # Dockerfile.ci が /usr/local/bin へ焼く隔離 DuckDB ランナー（COPY 対象・欠落するとビルド失敗）。
      - name: download tabular runner binary (tabular-runner の成果物)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shiki-tabular-runner-bin
          path: deploy/compose/prebuilt
      # compose 起動（イメージ pull ＋ healthcheck 待ち）は authz テストのコンパイルと独立
      # なので background step で並列化する（2026-06 の parallel steps 機能）。
      - name: compose up (依存 + shiki-server → healthy 待ち)
        id: compose-up
        background: true
        working-directory: deploy/compose
        env:
          # smoke は RAG（qdrant / ingestion-worker）を立てないため無効化する
          #（worker イメージビルドと Qdrant への再接続ノイズを避ける）。
          SHIKI__RAG__ENABLED: "false"
        run: |
          cp .env.example .env
          docker compose up -d --build shiki-server
          for i in $(seq 1 60); do
            s=$(docker compose ps shiki-server --format '{{.Health}}' || true)
            echo "attempt $i: health=$s"
            [ "$s" = "healthy" ] && exit 0
            sleep 5
          done
          echo "shiki-server が healthy になりませんでした"; exit 1
      - name: authz 結合テストを先にコンパイル（compose 起動と並列）
        run: cargo test -p shiki-authz --test check --no-run
      - name: wait for shiki-server healthy
        wait: compose-up
      - name: smoke test (BFF code フロー)
        working-directory: deploy/compose
        run: bash smoke-bff.sh

      # tenant / roles 属性はユーザーが Account API で書き換えられない（越境防止）・管理者は書ける（#809）。
      - name: smoke test (Keycloak User Profile — tenant / roles は管理者のみ)
        working-directory: deploy/compose
        run: bash smoke-keycloak-user-profile.sh

      - name: smoke test (skillex)
        working-directory: deploy/compose
        run: |
          set -euo pipefail
          echo "--- skillex client_credentials (aud=shiki-llm) ---"
          SK=$(curl -s -X POST http://localhost:8081/realms/shiki/protocol/openid-connect/token \
            -d grant_type=client_credentials -d client_id=skillex -d client_secret=skillex-dev-secret \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          echo "$SK" | cut -d. -f2 | python3 -c "import sys,base64,json; p=sys.stdin.read().strip(); p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); a=c.get('aud'); a=a if isinstance(a,list) else [a]; assert 'shiki-llm' in a, a; print('skillex aud OK:', a, 'azp=', c.get('azp'))"
      - name: authz 結合テスト（live OpenFGA で allow/deny 検証）
        env:
          # compose で OpenFGA HTTP API はホスト 8082 に公開している。
          OPENFGA_TEST_URL: http://localhost:8082
        run: cargo test -p shiki-authz --test check -- --nocapture
      - name: dump logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color | tail -200

  web-e2e:
    name: "Web E2E (Playwright: ログイン→保護ページ→ログアウト)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # gen:api の生成物は gen-api ジョブから受け取る（Rust ツールチェーンも rust-cache も要らない）。
    needs: [changes, build-server, tabular-runner, gen-api]
    if: needs.changes.outputs.compose == 'true'
    env:
      # shiki-server はビルド済みバイナリの runtime-only イメージ（CI override）を使う。
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: download shiki-server binary (build-server の成果物)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shiki-server-bin
          path: deploy/compose/prebuilt
      # CSV クエリの隔離 DuckDB ランナー（Dockerfile.ci が /usr/local/bin へ焼く）。
      - name: download tabular runner binary (tabular-runner の成果物)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shiki-tabular-runner-bin
          path: deploy/compose/prebuilt
      # Takumi Guard: pnpm install 前に npm プロキシを設定（匿名＝ブロックのみ）。
      - uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # BFF を web オリジン(:3000)経由で回すため、redirect_uri を web に向ける。
      # （compose-smoke は web 無しで :8080 を使うが、E2E はブラウザが :3000 を見る）
      # compose 起動チェーンは web ビルド（install / build / Playwright）と独立
      # なので background step で並列化する（2026-06 の parallel steps 機能）。
      - name: compose up (keycloak + shiki-server → healthy 待ち)
        id: compose-up
        background: true
        working-directory: deploy/compose
        env:
          SHIKI__AUTH__REDIRECT_URI: http://localhost:3000/auth/callback
          SHIKI__AUTH__POST_LOGOUT_REDIRECT_URI: http://localhost:3000/
          # E2E は検索ページの表示スモークのみ（実インジェストは compose 検証で担保）。
          SHIKI__RAG__ENABLED: "false"
        run: |
          cp .env.example .env
          docker compose up -d --build shiki-server
          for i in $(seq 1 60); do
            s=$(docker compose ps shiki-server --format '{{.Health}}' || true)
            echo "attempt $i: health=$s"
            [ "$s" = "healthy" ] && exit 0
            sleep 5
          done
          echo "shiki-server が healthy になりませんでした"; exit 1
      - name: install (web)
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: download generated types (gen-api ジョブの成果物)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-generated
          path: web/src/generated
      # `pnpm build` は prebuild で gen:api（cargo）を回してしまうため、next build を直接呼ぶ
      # （このジョブには Rust ツールチェーンもキャッシュも無い。生成物は上で受け取り済み）。
      - name: build (web)
        working-directory: web
        run: pnpm exec next build
      - name: install Playwright browser
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: wait for shiki-server healthy
        wait: compose-up
      # 回す spec は changes ジョブが担当シナリオ対応表（ci/scenarios.toml）で選んだもの（空なら全部）。
      # JSON レポートは main で落ちた spec を selection-gap ジョブへ渡すため。
      - name: run E2E (BFF + Keycloak 実フロー)
        working-directory: web
        env:
          CI: "true"
          BACKEND_ORIGIN: http://localhost:8080
          E2E_ARGS: ${{ needs.changes.outputs.e2e_args }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: |
          # 引数は語分割させる（changes ジョブが組んだ spec の正規表現・空白を含まない）。
          # shellcheck disable=SC2086
          pnpm exec playwright test --reporter=github,list,json $E2E_ARGS
      - name: upload failed specs (main)
        if: failure() && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-failures-e2e
          path: web/e2e-results.json
          if-no-files-found: ignore
          retention-days: 7
      # CI の reporter は github / list で HTML レポート（playwright-report）を作らないため、
      # 以前はこの artifact が常に空だった。リトライ時の trace（trace: on-first-retry）が入る
      # test-results も上げ、落ちたテストの DOM・操作・ネットワークを後から追えるようにする。
      - name: upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: dump compose logs on failure
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color | tail -200

  # main の全量 run で落ちたテストが、その変更を PR として選んだときに選ばれていたかを突き合わせる（#922）。
  # 選ばれていなければ、PR では見逃す変更（選択規則・対応表の漏れ）か flaky なので Issue にする
  # （同じテストの Issue が開いていればコメントを足す）。main は止めない（全量なので落ちたこと自体は見えている）。
  selection-gap:
    name: 選択漏れの検知（main）
    needs: [changes, rust, coverage, data-strategies, cargo-deny, build-server, compose-smoke, web-e2e,
            tabular-runner, gen-api, web, python]
    if: always() && github.event_name == 'push' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-failures-*
          path: failures
      # changes ジョブが PR としての選択を出せなかったときは無い（次の step が突き合わせを飛ばす）。
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: pr-selection
          path: selection
      - name: compare (落ちたテスト × PR としての選択)
        id: gap
        run: |
          if [ ! -f selection/pr-selection.json ]; then
            echo "PR としての選択が無いので突き合わせない"; exit 0
          fi
          python3 scripts/ci-select.py selection-gap --selection selection/pr-selection.json --dir failures \
            --output gap.md
        env:
          # 落ちたジョブのうち、PR ではジョブごと回らないものも突き合わせる。
          NEEDS: ${{ toJSON(needs) }}
      - name: Issue を起票（同じテストの Issue が開いていればコメント）
        if: steps.gap.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.gap.outputs.title }}
        run: |
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq "map(select(.title == env.TITLE)) | .[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file gap.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body-file gap.md --label area:ci
          fi
