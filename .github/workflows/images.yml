# shiki-server / ingestion-worker のコンテナイメージを GHCR へ publish する。
#
# **これが無いと K8s へ載せられない。** compose は `build:` 指定だけで `image:`
# タグを持たず、CI も push していなかったため、GHCR にあるのは自前ビルドの
# Collabora (office-image.yml) だけだった。K8s は pull しかできないので、
# プレビュー環境を compose から K8s へ移す前提条件がこれ。
#
# **タグは commit SHA を正とする。** GitOps 側 (imanect-labs/giken-ops) は
# `sha-<短縮SHA>` をピンして「いまデプロイされているのはどのコミットか」を
# 一意に決める。`main` は人が手で引くとき用の別名で、ピン先には使わない。
#
# 注意: deploy/Dockerfile の Rust ビルドは `--mount=type=cache` を使っている。
# cache mount はレイヤキャッシュに含まれず GHA キャッシュへ export されない
# ため、**buildx のキャッシュを足しても Rust のコンパイルは毎回フルで走る**
# (20 分前後)。paths でトリガを絞っているのはこのため。
name: images

on:
  push:
    branches: [main]
    paths:
      # shiki-server (deploy/Dockerfile はリポジトリルートを context に取る)
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "migrations/**"
      - "web/editor-sandbox/**"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - "deploy/Dockerfile"
      # web (Next.js BFF)。**gen:api の入力である crates/** も上にあるので、
      # Rust の型が変われば web も焼き直される（型は Rust から生成される）。
      - "web/**"
      # 型生成そのもののスクリプト。これだけ変えた push でも web を焼き直す。
      - "scripts/gen-api.sh"
      # ingestion-worker
      - "ingestion-worker/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # 同じ ref の古いビルドは捨てる。main が連続で進んだとき、古い SHA の
  # イメージを作り終える意味は無い。
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # **何をビルドするか変更パスから決める。** TSX を 1 行直しただけで
  # shiki-server のフルビルド（約 20 分。cargo の cache mount は GHA へ
  # export されないので毎回フル）が走るのは無駄が大きい。
  #
  # workflow_dispatch では全部作る（手で叩くのは作り直したいときなので）。
  select:
    name: 変更パスから対象を決める
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 差分を取るため直前のコミットも要る。
          fetch-depth: 2
          persist-credentials: false
      - id: pick
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            changed=""
            all=1
          else
            changed=$(git diff --name-only HEAD~1 HEAD)
            all=0
          fi
          echo "変更ファイル:"
          echo "$changed" | while IFS= read -r f; do [ -n "$f" ] && echo "  $f"; done

          want() {  # want <正規表現>
            [ "$all" = 1 ] && return 0
            echo "$changed" | grep -qE "$1"
          }

          names=""
          # server: Rust と migration と deploy/Dockerfile と editor-sandbox。
          want '^(crates/|vendor/|migrations/|Cargo[.](toml|lock)$|deploy/Dockerfile$|web/editor-sandbox/|web/package[.]json$|web/pnpm-lock[.]yaml$|[.]github/workflows/images[.]yml$)' \
            && names="$names shiki-server"
          # worker: Python 側だけ。
          want '^(ingestion-worker/|[.]github/workflows/images[.]yml$)' \
            && names="$names shiki-ingestion-worker"
          # web: web 全体と、型生成の入力である Rust 定義とスクリプト。
          want '^(web/|crates/|Cargo[.](toml|lock)$|scripts/gen-api[.]sh$|[.]github/workflows/images[.]yml$)' \
            && names="$names shiki-web"

          echo "ビルド対象:$names"
          if [ -z "$names" ]; then
            echo 'any=false' >> "$GITHUB_OUTPUT"
            echo 'matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'any=true' >> "$GITHUB_OUTPUT"
          # 名前の配列を JSON にして matrix へ渡す。
          # $names は空白区切りの名前列。改行に直して python へ渡す
          # （単語分割を期待しているので quote しない形を避け、tr で明示する）。
          json=$(printf '%s' "$names" | tr ' ' '\n' | python3 -c 'import json,sys; print(json.dumps({"include":[{"name":n.strip()} for n in sys.stdin if n.strip()]}))')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: select
    if: needs.select.outputs.any == 'true'
    name: ${{ matrix.name }} → GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # **片方が落ちても他方は作り切る。** 両方揃わないと K8s 側は古い SHA を
      # 使い続けるだけなので、部分的な成功にも意味がある。
      fail-fast: false
      # 対象は select job が変更パスから決める（名前だけの配列）。
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # イメージ名から固有の設定を引く。matrix に持たせると select 側で
      # 全部を組み立てる必要があり、2 箇所に同じ知識が散る。
      - name: このイメージの設定を決める
        run: |
          set -euo pipefail
          case "${{ matrix.name }}" in
            shiki-server)
              # deploy/Dockerfile はリポジトリルートを context に取る。
              echo "CONTEXT=." >> "$GITHUB_ENV"
              echo "DOCKERFILE=deploy/Dockerfile" >> "$GITHUB_ENV"
              # Rust の release ビルドと node のエディタ砂箱でディスクを食う。
              echo "FREE_DISK=1" >> "$GITHUB_ENV"
              echo "NEEDS_GEN=0" >> "$GITHUB_ENV"
              echo "BUILD_ARGS=" >> "$GITHUB_ENV"
              ;;
            shiki-ingestion-worker)
              echo "CONTEXT=ingestion-worker" >> "$GITHUB_ENV"
              echo "DOCKERFILE=ingestion-worker/Dockerfile" >> "$GITHUB_ENV"
              echo "FREE_DISK=0" >> "$GITHUB_ENV"
              echo "NEEDS_GEN=0" >> "$GITHUB_ENV"
              echo "BUILD_ARGS=" >> "$GITHUB_ENV"
              ;;
            shiki-web)
              echo "CONTEXT=web" >> "$GITHUB_ENV"
              echo "DOCKERFILE=web/Dockerfile" >> "$GITHUB_ENV"
              echo "FREE_DISK=1" >> "$GITHUB_ENV"
              # **gen:api が要る。** web/Dockerfile は生成物が揃っている前提で、
              # 無ければ明示的に失敗する。生成は cargo を 4 本走らせるので
              # イメージの中ではやらない。
              echo "NEEDS_GEN=1" >> "$GITHUB_ENV"
              # **ビルド時にバンドルへ焼き込まれる値。** 実行時の env では直せない。
              # BACKEND_ORIGIN はサーバ側のプロキシ先（クラスタ内 DNS）、
              # NEXT_PUBLIC_* はブラウザが見る先（公開ホスト）。
              {
                echo "BUILD_ARGS<<EOF"
                echo "BACKEND_ORIGIN=http://shiki-preview-server:8080"
                echo "NEXT_PUBLIC_GATEWAY_ORIGIN=https://shiki-preview.imanect.app"
                echo "NEXT_PUBLIC_B1_ORIGIN=https://shiki-preview.imanect.app"
                echo "NEXT_PUBLIC_OIDC_ISSUER=https://shiki-preview-auth.imanect.app/realms/shiki"
                echo "EOF"
              } >> "$GITHUB_ENV"
              ;;
            *) echo "未知のイメージ: ${{ matrix.name }}" >&2; exit 1 ;;
          esac

      - name: free disk space (不要プリインストール削除)
        if: env.FREE_DISK == '1' 
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL

      - name: タグを決める (SHA を正とする)
        run: |
          set -euo pipefail
          # github.sha は PR の merge commit になりうるが、このワークフローは
          # push(main) と workflow_dispatch だけなので実コミットを指す。
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}" >> "$GITHUB_ENV"
          echo "SHA_TAG=sha-$(git rev-parse --short=12 HEAD)" >> "$GITHUB_ENV"

      # ---- web だけ: gen:api で型を生成してからビルドする ----
      - uses: dtolnay/rust-toolchain@master
        if: env.NEEDS_GEN == '1'
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
        if: env.NEEDS_GEN == '1'
      - uses: pnpm/action-setup@v4
        if: env.NEEDS_GEN == '1'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: env.NEEDS_GEN == '1'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: install (web)
        if: env.NEEDS_GEN == '1'
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: gen:api (Rust 定義から型生成)
        if: env.NEEDS_GEN == '1'
        working-directory: web
        run: pnpm gen:api
      - name: 生成物が揃っていることを確認
        if: env.NEEDS_GEN == '1'
        run: |
          set -euo pipefail
          # **Dockerfile 側でも確認しているが、ここで落とした方が原因が分かりやすい**
          # （docker build のログに埋もれない）。
          for f in web/src/generated/openapi.json web/src/generated/api.d.ts \
                   web/src/generated/authz-vocab.ts; do
            [ -s "$f" ] || { echo "生成物が無い: $f"; exit 1; }
          done
          ls -la web/src/generated/

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # **smoke を通してから publish する。** 1 段で push すると、起動して
      # 500 を返すイメージや root で動くイメージが先に `:main` を上書きしてから
      # smoke が落ちる。ワークフローが赤でも壊れたものが配られてしまう。
      #
      # そこで「ローカルへ load → smoke → 同じキャッシュで push」に分ける。
      # 2 回目は cache-from が効くので再ビルドにはならない。
      - name: build (ローカルへ load・まだ publish しない)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:smoke
          platforms: linux/amd64
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}

      - name: smoke (shiki-server — 3 つの COPY 先が揃っていること)
        if: matrix.name == 'shiki-server'
        run: |
          set -euo pipefail
          IMG="${IMAGE}:smoke"
          # **バイナリだけ確認しても足りない。** deploy/Dockerfile は別ビルドの
          # tabular runner と、node で作ったエディタ砂箱 dist を COPY している。
          # COPY 元のパスが変わると、起動はするのに機能だけ欠けた
          # イメージが出来上がる (SHIKI__GATEWAY__BUILTIN_DIR が空になる)。
          docker run --rm --entrypoint sh "$IMG" -c '
            set -e
            command -v shiki-server
            command -v shiki-tabular-runner
            test -n "$(ls -A /opt/shiki/builtin)" || { echo "builtin dir が空"; exit 1; }
            ls /opt/shiki/builtin
          '

      - name: smoke (web — standalone が起動して応答すること)
        if: matrix.name == 'shiki-web'
        run: |
          set -euo pipefail
          IMG="${IMAGE}:smoke"
          # **「起動した」だけでは足りない。** standalone の COPY 漏れは起動後に
          # 初めて 500 になるので、実際にページを引いて中身を見る。
          docker run -d --name web-smoke -p 127.0.0.1:13000:3000 "$IMG"
          # カウンタを明示的に使う（未使用変数の警告を避ける）。
          tries=0
          until curl -sf -o /dev/null http://127.0.0.1:13000/login; do
            tries=$((tries + 1))
            [ "$tries" -ge 60 ] && { echo "起動しない"; docker logs web-smoke; exit 1; }
            sleep 2
          done
          code=$(curl -s -o /tmp/body -w '%{http_code}' http://127.0.0.1:13000/login)
          echo "GET /login => $code"
          [ "$code" = "200" ] || { echo "200 でない"; docker logs web-smoke; exit 1; }
          # Next.js が実際にレンダリングしたか（静的アセットの参照があるか）。
          grep -q '/_next/static' /tmp/body || { echo "描画されていない"; head -c 400 /tmp/body; exit 1; }
          echo "  /login が 200 で _next/static を含む"
          # 非 root で動いていること。
          u=$(docker exec web-smoke id -u)
          echo "  uid=$u"
          [ "$u" != "0" ] || { echo "root で動いている"; exit 1; }
          docker rm -f web-smoke

      - name: smoke (ingestion-worker — アプリが import 可能であること)
        if: matrix.name == 'shiki-ingestion-worker'
        run: |
          set -euo pipefail
          IMG="${IMAGE}:smoke"
          # find_spec はモジュールを実行しない。import してしまうと HF から
          # モデルを取りに行きかねないので、解決できることだけを見る。
          docker run --rm --entrypoint uv "$IMG" \
            run --no-sync python -c '
          import importlib.util, sys
          for m in ("ingestion_worker.main", "uvicorn"):
              if importlib.util.find_spec(m) is None:
                  print(f"{m} が解決できない"); sys.exit(1)
          print("import OK")
          '

      # smoke が全部通ってから publish する。build はキャッシュから再利用される。
      - name: push (smoke 通過後に publish)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA_TAG }}
            ${{ env.IMAGE }}:main
          build-args: ${{ env.BUILD_ARGS }}
          cache-from: type=gha,scope=${{ matrix.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 公開されたタグを出す
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo '```'
            echo "${IMAGE}:${SHA_TAG}"
            echo "${IMAGE}:main"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
