# cargo-deny 設定（サプライチェーン検査）。CI は `cargo deny check`。
# エンタープライズ前提: 脆弱性・ライセンス違反・出所不明 crate を機械的に止める。
# 参照: https://embarkstudios.github.io/cargo-deny/

[graph]
# ターゲット横断で健全性を見たいので全 feature を評価する。
all-features = true

[advisories]
# RUSTSEC advisory DB を参照し、脆弱性・yanked を止める。
version = 2
yanked = "deny"
# 誤検知・対応保留は理由付きでここに列挙する。
ignore = [
    # smallstr は yrs（共同編集 CRDT）の推移依存。unmaintained 通知であり既知脆弱性は無い。
    # yrs 上流が置換（compact_str 等）するまで解消不可。上流更新で外す（要追跡）。
    { id = "RUSTSEC-2026-0215", reason = "yrs 推移依存の smallstr unmaintained 通知。脆弱性ではなく yrs 上流の置換待ち。" },
    # smartstring は swc_ecma_parser（shiki script の TS/JS パーサ）の推移依存。
    # smallstr と同型の unmaintained 通知で、既知脆弱性は無い。swc 上流が置換するまで
    # cargo update では到達できない。上流更新で外す（要追跡）。
    { id = "RUSTSEC-2026-0249", reason = "swc_ecma_parser 推移依存の smartstring unmaintained 通知。脆弱性ではなく swc 上流の置換待ち。" },
    # unsafe-libyaml は lindera（日本語形態素解析）→ serde_yaml_ng の推移依存。smallstr と同型の
    # unmaintained 通知で、既知脆弱性は無い（安全な更新先も無い）。lindera 上流が置換するまで
    # cargo update では到達できない。上流更新で外す（要追跡）。
    { id = "RUSTSEC-2024-0449", reason = "lindera 推移依存の unsafe-libyaml unmaintained 通知。脆弱性ではなく lindera 上流の置換待ち。" },
    # webpki-roots 0.26.11 は 1.x を再エクスポートするだけの互換 shim（証明書を同梱しない）。
    # 実体は lock で 1.0.10（emSign ルート除去済み）に解決されるので影響は無いが、advisory は
    # 版数で一致する。0.26 系に修正版は出ない。sqlx-core / tokio-tungstenite が 1.x へ移ったら外す。
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.11 は 1.x の再エクスポート shim。実体は修正済みの 1.0.10 に解決されている。" },
]

[licenses]
version = 2
# 許可する SPDX ライセンス（permissive 中心 ＋ 弱コピーレフト MPL/Unicode）。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    # webpki-roots（ルート証明書バンドル）のデータライセンス。permissive。
    "CDLA-Permissive-2.0",
]
# 自社 crate は publish=false（UNLICENSED）。ライセンス検査の対象外にする。
private = { ignore = true }
confidence-threshold = 0.8

[bans]
# 同一 crate の複数バージョン混在は肥大化の兆候。まずは警告で可視化する。
multiple-versions = "warn"
# ワイルドカード依存（version = "*"）は再現性を損なうため禁止。
# ただしワークスペース内の path 依存（shiki-* = { path = ... }）は version を持たず
# 実質 "*" 扱いになるため、これらは例外として許可する。
wildcards = "deny"
allow-wildcard-paths = true
# 明確に禁止したい crate があればここに追加する（例: openssl 系を rustls に寄せる等）。
deny = []

[sources]
# crates.io 以外の未知レジストリ / 未知 git 出所を禁止する（供給元の固定）。
unknown-registry = "deny"
unknown-git = "deny"
