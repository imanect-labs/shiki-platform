# cargo-deny 設定（サプライチェーン検査）。CI は `cargo deny check`。
# エンタープライズ前提: 脆弱性・ライセンス違反・出所不明 crate を機械的に止める。
# 参照: https://embarkstudios.github.io/cargo-deny/

[graph]
# ターゲット横断で健全性を見たいので全 feature を評価する。
all-features = true

[advisories]
# RUSTSEC advisory DB を参照し、脆弱性・yanked を止める。
version = 2
yanked = "deny"
# 誤検知・対応保留は理由付きでここに列挙する。
ignore = [
    # smallstr は yrs（共同編集 CRDT）の推移依存。unmaintained 通知であり既知脆弱性は無い。
    # yrs 上流が置換（compact_str 等）するまで解消不可。上流更新で外す（要追跡）。
    { id = "RUSTSEC-2026-0215", reason = "yrs 推移依存の smallstr unmaintained 通知。脆弱性ではなく yrs 上流の置換待ち。" },
    # smartstring は swc_ecma_parser（shiki script の TS/JS パーサ）の推移依存。
    # smallstr と同型の unmaintained 通知で、既知脆弱性は無い。swc 上流が置換するまで
    # cargo update では到達できない。上流更新で外す（要追跡）。
    { id = "RUSTSEC-2026-0249", reason = "swc_ecma_parser 推移依存の smartstring unmaintained 通知。脆弱性ではなく swc 上流の置換待ち。" },
    # unsafe-libyaml は lindera（日本語形態素解析）→ serde_yaml_ng の推移依存。smallstr と同型の
    # unmaintained 通知で、既知脆弱性は無い（安全な更新先も無い）。lindera 上流が置換するまで
    # cargo update では到達できない。上流更新で外す（要追跡）。
    { id = "RUSTSEC-2024-0449", reason = "lindera 推移依存の unsafe-libyaml unmaintained 通知。脆弱性ではなく lindera 上流の置換待ち。" },
    # zip 6.0.0 は隔離ランナー（crates/tabular/runner・別の Cargo.lock）の libduckdb-sys の
    # build-dependencies。libduckdb-sys は zip を「bundled でないとき」の配布物の展開
    # （ZipArchive::extract）にだけ使い、ランナーは bundled で DuckDB を自前でビルドするので、
    # ビルドの中でも呼ばれない。ランナーの実行ファイルにも入らない。4 件とも extract
    # （展開先へのファイル・シンボリックリンク・権限の書き出し）の不具合で、修正は zip 9（semver
    # 非互換）。libduckdb-sys が `zip = "6"` を固定しているため cargo update では上げられない。
    # ランナー自身が Excel を読む zip は 9.3（修正済み・deflate だけ・extract は使わない）。
    # ID でしか外せないので、ランナーの zip を 9 未満に戻すとここでは止まらない（Cargo.toml で見る）。
    # libduckdb-sys が zip 9 以上に上がったら外す（GAP-85）。
    { id = "RUSTSEC-2026-0367", reason = "zip 6.0 は libduckdb-sys の build 依存で、bundled では使わない extract の不具合。ランナーの zip は修正済みの 9.3。" },
    { id = "RUSTSEC-2026-0368", reason = "zip 6.0 は libduckdb-sys の build 依存で、bundled では使わない extract の不具合。ランナーの zip は修正済みの 9.3。" },
    { id = "RUSTSEC-2026-0369", reason = "zip 6.0 は libduckdb-sys の build 依存で、bundled では使わない extract の不具合。ランナーの zip は修正済みの 9.3。" },
    { id = "RUSTSEC-2026-0429", reason = "zip 6.0 は libduckdb-sys の build 依存で、bundled では使わない extract の不具合。ランナーの zip は修正済みの 9.3。" },
    # webpki-roots 0.26.11 は sqlx-core・tokio-tungstenite の推移依存で、自前の証明書を持たず
    # webpki-roots v1 を再エクスポートするだけの互換用クレート（semver trick）。0.26 系に修正版は
    # 出ないため advisory 上は残るが、実体の v1 は 1.0.10（emSign ルートを外した版）に上げてある。
    # advisory は ID でしか外せないため、v1 側が 1.0.10 未満に戻ってもこの ID では止まらない
    # （Cargo.lock の差分で見る）。sqlx・tokio-tungstenite が v1 へ移ったら外す（要追跡）。
    { id = "RUSTSEC-2026-0381", reason = "webpki-roots 0.26.11 は v1 の再エクスポートのみ。実体の v1 は修正済みの 1.0.10。" },
    # zstd 0.13.3 / zstd-safe 7.2.4 は tantivy 0.25（tantivy-sstable・lindera-tantivy が既定機能で
    # 有効化）と wasmtime 49 の cache 機能の推移依存。修正版（zstd 0.14.3 / zstd-safe 8.2.0）は
    # semver 非互換で、wasmtime は 50 でも zstd 0.13、tantivy 0.27 は lindera-tantivy が未対応のため
    # cargo update では到達できない。3 件とも影響する関数を名指ししており、この経路では呼ばれない:
    # tantivy-sstable は bulk API（Compressor/Decompressor）、wasmtime-internal-cache は
    # encode_all/decode_all だけを使う。seekable 機能は無効で、自前のクレートは zstd を直接使わない。
    # zstd を直接使うようになったら見直し、上流が zstd 0.14 に上がったら外す（#932）。
    { id = "RUSTSEC-2026-0391", reason = "影響は stream::raw::{Encoder,Decoder}::with_context のみ。tantivy は bulk API、wasmtime は encode_all/decode_all だけを使う。" },
    { id = "RUSTSEC-2026-0398", reason = "影響は seekable 機能の Seekable::decompress・AdvancedSeekable::decompress のみ。seekable 機能は無効。" },
    { id = "RUSTSEC-2026-0403", reason = "影響は DCtx::decompress_stream（stream::write::Decoder 経由）のみ。bulk API・decode_all は対象外と advisory に明記。" },
]

[licenses]
version = 2
# 許可する SPDX ライセンス（permissive 中心 ＋ 弱コピーレフト MPL/Unicode）。
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    # webpki-roots（ルート証明書バンドル）のデータライセンス。permissive。
    "CDLA-Permissive-2.0",
]
# 自社 crate は publish=false（UNLICENSED）。ライセンス検査の対象外にする。
private = { ignore = true }
confidence-threshold = 0.8

[bans]
# 同一 crate の複数バージョン混在は肥大化の兆候。まずは警告で可視化する。
multiple-versions = "warn"
# ワイルドカード依存（version = "*"）は再現性を損なうため禁止。
# ただしワークスペース内の path 依存（shiki-* = { path = ... }）は version を持たず
# 実質 "*" 扱いになるため、これらは例外として許可する。
wildcards = "deny"
allow-wildcard-paths = true
# 単一チョークポイント（AGENTS.md の不変条件・docs/design.md §1）を依存グラフで固定する。
# `wrappers` に挙げたクレートだけが直接依存してよい。それ以外のクレートが直接依存すると落ちる。
# 足すときは「なぜそのクレートがチョークポイントの内側なのか」をコメントに書くこと。
deny = [
    # オブジェクトストアは StorageService（ObjectStore トレイトの裏）だけが触る。
    # 他クレートが直接 S3 を叩くと、認可・監査・テナント境界（キーの名前空間）を素通りする。
    { crate = "aws-sdk-s3", wrappers = ["shiki-storage"], reason = "オブジェクトストアは StorageService 経由のみ" },
    # 全文索引は RAG の二段 authz（pre-filter ＋ post-filter）の内側にだけ置く。
    # lindera-tantivy は形態素解析のトークナイザ（tantivy の拡張）で、索引を読み書きしない。
    { crate = "tantivy", wrappers = ["shiki-rag", "lindera-tantivy"], reason = "全文索引は RAG の二段 authz の内側のみ" },
]

[sources]
# crates.io 以外の未知レジストリ / 未知 git 出所を禁止する（供給元の固定）。
unknown-registry = "deny"
unknown-git = "deny"
