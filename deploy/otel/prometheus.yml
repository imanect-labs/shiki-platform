global:
  scrape_interval: 10s

scrape_configs:
  # otel-collector が公開する Prometheus エンドポイント（shiki-server のメトリクスを中継）。
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # Postgres の pg_stat_*（クエリ別累積時間・dead tuple・autovacuum）。
  # 使い方は docs/guides/db-observability.md。
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
