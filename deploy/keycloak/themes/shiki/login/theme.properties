# Shiki のログインテーマ（Keycloak 既定テーマの置き換え）。
# - レイアウト（template.ftl）とログイン画面（login.ftl）は独自実装。それ以外の画面
#   （OTP・パスキー・パスワード更新・エラー等）は base のテンプレートを使い、
#   下の kc*Class で独自 CSS（css/shiki.css）のクラスへ写す。
# - PatternFly は読み込まない（Keycloak の見た目を持ち込まない）。
parent=base
import=common/keycloak

locales=ja,en

styles=css/shiki.css

