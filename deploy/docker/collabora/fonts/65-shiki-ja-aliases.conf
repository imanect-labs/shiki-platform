<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Windows / macOS の日本語フォント名を、同梱の Noto CJK（日本語版）へ寄せる（#725）。

  日本語の docx は 游ゴシック・MS 明朝 などを指定しているが、イメージには入っていない。
  別名が無いと、ゴシック指定でも明朝系で出たり、中国語（簡体字）版の字形で描かれたりする
  （実機で確認）。ゴシック系は Noto Sans CJK JP、明朝系は Noto Serif CJK JP にし、無ければ engine に
  同梱の Noto Sans JP / Noto Serif JP にする（別名が無いと明朝の指定もゴシックで描かれる・26.04.5 で確認）。
  binding="same" で、指定した名前と同じ強さで置き換える（1 つの alias に family は 1 つしか書けない）。
-->
<fontconfig>
  <alias binding="same"><family>游ゴシック</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>游ゴシック体</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>游ゴシック Medium</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>YuGothic</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic UI</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>Yu Gothic Medium</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>MS ゴシック</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>ＭＳ ゴシック</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>MS Gothic</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>MS Pゴシック</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>ＭＳ Ｐゴシック</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>MS PGothic</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>MS UI Gothic</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>メイリオ</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
  <alias binding="same"><family>Meiryo</family><prefer><family>Noto Sans CJK JP</family><family>Noto Sans JP</family></prefer></alias>
