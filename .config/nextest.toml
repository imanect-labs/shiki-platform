# cargo-nextest 設定（CI 高速化）。rust ジョブ（compose 非依存＝ユニット中心）で使う。
# coverage ジョブは cargo test のまま（nextest のプロセス毎実行が in-process 共有 fixture に
# 依存する IT を壊すため・ci.yml 参照）。
[profile.default]
# 一過性 flake を自動リトライで緑化（真の失敗は 2 回とも落ちるので検知は保つ）。
retries = 2
# 遅いテストは警告のみで kill しない（誤検知回避）。
slow-timeout = "120s"

# main で落ちたテストを selection-gap ジョブが読む（PR で選ばれていたかの突き合わせ・#922）。
# 出力先は target/nextest/default/junit.xml。再試行で通った flaky は failure にならない。
[profile.default.junit]
path = "junit.xml"
