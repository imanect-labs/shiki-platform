[package]
name = "shiki-data"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
version = "0.0.0"

[lib]
name = "data"

[dependencies]
tracing.workspace = true
shiki-authz.workspace = true
shiki-storage.workspace = true
shiki-artifact.workspace = true
shiki-jobq.workspace = true

sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
async-trait.workspace = true
sha2.workspace = true
uuid = { workspace = true, features = ["v4"] }
# DTO を単一定義し api 層に手書きミラーを作らない（codegen が正）。
utoipa.workspace = true
# keyset カーソルの AEAD（Task 15.1・secrets と同じ AES-256-GCM）。
aes-gcm = { version = "0.10", features = ["aes", "alloc"] }
rand.workspace = true
base64.workspace = true
# 識別子移行ジョブの常駐ワーカー。
tokio.workspace = true

[dev-dependencies]
reqwest.workspace = true
# 内部整数キーの計測（uuid 集合 vs Roaring ビットマップ・tests/internal_key_bench_it.rs）。
roaring = "0.10"

# lib 名 authz/storage で参照するため machete が誤検出する。
[package.metadata.cargo-machete]
ignored = ["shiki-authz", "shiki-storage", "shiki-artifact", "shiki-jobq"]

[lints]
workspace = true
