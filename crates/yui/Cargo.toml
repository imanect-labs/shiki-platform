[package]
name = "shiki-yui"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
version = "0.0.0"

[lib]
name = "yui"

# 回答の本文の ```ui ブロック（`@imanect/yui`）のうち、操作を持つ種類（app・ask・plan）を
# サーバー側で読む。ボタンの束縛の宣言と、ボタンが送る値の検証に使う（TS 版と同じ規則）。
[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true }
regex = "1"
unicode-normalization = "0.1"

[lints]
workspace = true
