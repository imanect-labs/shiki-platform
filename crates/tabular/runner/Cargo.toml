# 隔離 DuckDB ランナー（Task 11P.7・PIT-39）。**メイン workspace から除外**された独立
# クレート（root Cargo.toml の exclude 参照）。重い C++（bundled DuckDB）を含むため、
# メインの --all-features build/clippy/coverage から切り離して別 target でビルドする。
# ビルド: cargo build --manifest-path crates/tabular/runner/Cargo.toml --release
[package]
name = "shiki-tabular-runner"
edition = "2021"
rust-version = "1.96"
license = "UNLICENSED"
publish = false
version = "0.0.0"

[[bin]]
name = "shiki-tabular-runner"
path = "src/main.rs"

[dependencies]
# プロトコル型（RunnerRequest/RunnerResponse）を lib と共有する。
shiki-tabular = { path = ".." }
# 隔離 DuckDB（bundled C++）。このクレートだけがリンクする。
duckdb = { version = "1", features = ["bundled"] }
serde_json = "1"
# Excel（.xlsx）の読み取り（CSV を集計だけ・D-17）。数式は計算せず、保存されている値を読む。展開の前に zip の中身の
# 大きさと数を確かめる（zip 爆弾）。zip は calamine と同じ版を使い、deflate だけを有効にする。
calamine = { version = "0.38", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
# プロセスのアドレス空間の上限（RLIMIT_AS・PIT-39）。DuckDB の memory_limit は Rust 側の確保に効かない。
rustix = { version = "1", default-features = false, features = ["std", "process"] }

# lib 名 tabular で参照するため machete（名前一致）が誤検出する。
[package.metadata.cargo-machete]
ignored = ["shiki-tabular"]
