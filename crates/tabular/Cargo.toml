[package]
name = "shiki-tabular"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
version = "0.0.0"

[lib]
name = "tabular"

# CSV クエリ/パッチの単一チョークポイント（Task 11P.7・design §4.8.2）。
# **DuckDB は含まない**。実行は非特権別プロセス（`crates/tabular/runner`・workspace 除外）に
# 隔離し、本 lib はプロトコル・SQL 検証・パッチ・ランナー起動のみを持つ＝敵対的 CSV を
# api プロセス（本 lib の利用者）に一切食わせない（PIT-39）。
[dependencies]
shiki-authz.workspace = true
shiki-storage.workspace = true

# SQL の読み取り専用検証（単一 SELECT/WITH のみ許可・DDL/DML/ATTACH/PRAGMA 等を拒否）。visitor は SQL が読む表の
# 名前を取る（Excel のシートを名前で読む・GAP-84）。
sqlparser = { workspace = true, features = ["visitor"] }
# CSV 読み書き（パッチ書換）。
csv.workspace = true
# CSV の文字コード（Shift_JIS・BOM 付きの UTF-8・UTF-16）を決めて UTF-8 にする・編集後に元の文字コードで書く（GAP-45）。
shiki-textenc.workspace = true

serde = { workspace = true }
serde_json.workspace = true
thiserror.workspace = true
# 区切りを推定できなかったときの警告（編集はカンマ区切りとして続ける・BUG-144）。
tracing.workspace = true
tokio.workspace = true
uuid = { workspace = true, features = ["v4"] }
# CSV を隔離ランナーへ渡すための一時ファイル（api 側の私有 tmp）。
tempfile = "3"

[dev-dependencies]
# Excel（.xlsx）のテストの材料（zip 爆弾など）をテストの中で組む（runner_xlsx_it・D-17）。
crc32fast = "1"
flate2 = "1"

# lib 名 authz/storage で参照するため machete（名前一致）が誤検出する。
[package.metadata.cargo-machete]
ignored = ["shiki-authz", "shiki-storage", "shiki-textenc"]

[lints]
workspace = true
