[package]
name = "shiki-tabular-protocol"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
version = "0.0.0"

[lib]
name = "tabular_protocol"

# 隔離 DuckDB ランナー（`crates/tabular/runner`・workspace 除外）と api 側の `shiki-tabular` が共有するものだけを置く
# （GAP-95）: ランナーとの JSON プロトコルの型・Excel の入力の上限・SQL の読み取り専用の検証。ランナーはこのクレート
# だけに依存し、ストレージ・認可・HTTP・DB のクレートを組まない（ランナーの依存とビルドの時に動くコードを小さく保つ）。
# ここに足す依存はランナーにも入るので、サービスの側のもの（storage・authz・tokio など）は `shiki-tabular` に置く。
[dependencies]
# SQL の読み取り専用検証（単一 SELECT/WITH のみ許可・DDL/DML/ATTACH/PRAGMA 等を拒否）。visitor は SQL が読む表の
# 名前を取る（Excel のシートを名前で読む・GAP-84）。
sqlparser = { workspace = true, features = ["visitor"] }
serde = { workspace = true }
serde_json.workspace = true

[lints]
workspace = true
