[package]
name = "shiki-rag"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
version = "0.0.0"

[lib]
name = "rag"

[dependencies]
shiki-authz.workspace = true
shiki-storage.workspace = true
shiki-jobq.workspace = true

tokio.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true
# 検索 API の DTO を rag 側で単一定義し、api 層に手書きミラーを作らない（codegen が正）。
utoipa.workspace = true
# 引用監査に載せる検索語のハッシュ（生の検索語を監査ログへ残さない）。鍵付き（HMAC・#833）。
sha2.workspace = true
hmac.workspace = true
rand.workspace = true
# ParseSource::Bytes（外部 URL 由来の文書を worker に取りに行かせない・#405）の転送。
base64.workspace = true
# チャンク ID は uuid5(node_id, version, ordinal) の決定的生成（冪等 upsert の鍵）。
uuid = { workspace = true, features = ["v5"] }

# 全文検索（Task 2.5）: BM25 + 日本語形態素。lindera-tantivy 4.x は tantivy 0.25 系と対。
tantivy = "0.25"
lindera = { version = "4.0", features = ["embed-ipadic"] }
lindera-tantivy = { version = "4.0", features = ["embed-ipadic"] }

[dev-dependencies]
# HTTP クライアント実装（parser/embedding/rerank）のローカルスタブサーバ用。
axum.workspace = true
tokio.workspace = true
# Tantivy index-per-tenant のテスト用一時ディレクトリ。
tempfile = "3"
# 構造化データの permission-aware 検索の PoC（Task 15.8・tests/record_search_poc_it.rs）。
# rag は本体で data に依存しない（可視性は RecordVisibility トレイト越し）。
shiki-data.workspace = true

# shiki-authz/storage/jobq は lib 名 `authz`/`storage`/`jobq` で参照するため
# cargo-machete が誤検出する（実際は使用中）。
[package.metadata.cargo-machete]
ignored = ["shiki-authz", "shiki-storage", "shiki-jobq", "shiki-data"]

[lints]
workspace = true
