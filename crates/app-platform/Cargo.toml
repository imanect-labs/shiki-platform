[package]
name = "shiki-app-platform"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
version = "0.0.0"

[lib]
name = "app_platform"

[dependencies]
shiki-authz.workspace = true
shiki-artifact.workspace = true
shiki-storage.workspace = true
shiki-data.workspace = true
shiki-agent-core.workspace = true
# egress の SSRF 判定（net_guard・IP 分類の単一の正）。
shiki-sandbox-client.workspace = true
shiki-gui.workspace = true
shiki-app-gateway.workspace = true
shiki-script-runtime.workspace = true
shiki-secrets.workspace = true
shiki-llm-gateway.workspace = true

sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tracing.workspace = true
reqwest.workspace = true
tokio.workspace = true
async-trait.workspace = true
url.workspace = true
# 関数のスケジュール（5 つの欄・標準の読み方・UTC）。ワークフローのスケジュールと同じ読み方を共有する（BUG-129）。
shiki-cron5.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
semver = "1"
uuid = { workspace = true, features = ["v4"] }
utoipa.workspace = true

[dev-dependencies]
shiki-testenv.workspace = true
axum.workspace = true
tokio.workspace = true
futures.workspace = true
# 実 Keycloak の結合テストの手助け（クライアントの登録・BUG-172）。
shiki-app-gateway = { workspace = true, features = ["test-support"] }

[package.metadata.cargo-machete]
ignored = ["shiki-authz", "shiki-artifact", "shiki-storage", "shiki-data", "shiki-agent-core", "shiki-gui", "shiki-app-gateway", "shiki-script-runtime", "shiki-secrets", "shiki-llm-gateway", "shiki-sandbox-client", "shiki-cron5"]

[lints]
workspace = true
