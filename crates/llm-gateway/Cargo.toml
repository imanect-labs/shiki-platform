[package]
name = "shiki-llm-gateway"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
version = "0.0.0"

[lib]
name = "llm_gateway"

[dependencies]
shiki-authz.workspace = true

tokio.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
# SSE ストリーミング（bytes_stream）に stream feature を足す（additive・他クレートへ無害）。
reqwest = { workspace = true, features = ["stream"] }
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true
chrono.workspace = true
uuid.workspace = true
# ChatGPT プラン接続（#854）の PKCE・ID トークンの読み取り。
base64.workspace = true
sha2.workspace = true
rand.workspace = true

[dev-dependencies]
tokio = { workspace = true }
axum.workspace = true
# 判定の評価（tests/decision_eval.rs）が dev と同じ TOML を読む（サーバと同じ読み方）。
figment.workspace = true
# 判定の自己申告を引き上げたときのログを試験で受ける（BUG-124）。
tracing-subscriber.workspace = true

# lib 名 authz で参照するため machete が誤検出する（実際は使用中）。
[package.metadata.cargo-machete]
ignored = ["shiki-authz"]

[lints]
workspace = true
