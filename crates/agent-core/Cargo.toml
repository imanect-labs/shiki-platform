[package]
name = "shiki-agent-core"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
version = "0.0.0"

[lib]
name = "agent_core"

[dependencies]
shiki-authz.workspace = true
shiki-rag.workspace = true
shiki-llm-gateway.workspace = true
shiki-sandbox-client.workspace = true
shiki-websearch.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
futures.workspace = true
url.workspace = true
uuid.workspace = true
# web_fetch のホストネイティブ取得（#348）。宛先は解決後 IP 検証＋アドレス固定で縛る。
reqwest.workspace = true
# 名前解決フェーズの期限（reqwest の timeout は client 構築後にしか効かない）。
# 抽出は CPU バウンド（DOM 構築）なので spawn_blocking へ逃がす＝rt も要る。
tokio = { workspace = true, features = ["time", "rt"] }
# web_fetch の HTML 本文抽出（#405）: 本文特定 → Markdown 化 → 文字コード判定。
dom_smoothie.workspace = true
dom_query.workspace = true
htmd.workspace = true
encoding_rs.workspace = true
chardetng.workspace = true
# 抽出の削減率・フォールバック率を観測する（回帰検知）。
tracing.workspace = true
# ツール名語彙（vocab.rs）を TS へ生成する（codegen が正・workflow-engine と同型）。
ts-rs = { workspace = true }

[dev-dependencies]
# 結合テスト（agent_it）は authz モック＋DB 直操作＋stub gateway で run_agent ループを走らせる。
tokio = { workspace = true }
shiki-authz.workspace = true
shiki-llm-gateway.workspace = true
sqlx.workspace = true
reqwest.workspace = true
uuid = { workspace = true, features = ["v4"] }
async-trait.workspace = true
serde_json.workspace = true
futures.workspace = true
proptest.workspace = true

# lib 名 authz/rag/llm_gateway で参照するため machete が誤検出する（実際は使用中）。
[package.metadata.cargo-machete]
ignored = ["shiki-authz", "shiki-rag", "shiki-llm-gateway", "shiki-sandbox-client", "shiki-websearch"]

[lints]
workspace = true
