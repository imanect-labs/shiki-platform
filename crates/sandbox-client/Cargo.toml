[package]
name = "shiki-sandbox-client"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
version = "0.0.0"

[lib]
name = "sandbox_client"

[features]
# orchestrator（server 側）だけが tonic の server スタブを使う。
# shiki-server（api）は default（client のみ）で依存し、server コードを引き込まない。
default = []
server = []

[dependencies]
tonic = { workspace = true }
prost = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
# SandboxBackend の serde 表現（admin ポリシー設定から backend ティアを選ぶ導線）。
serde = { workspace = true }
# net_guard の名前解決（SSRF/DNS リバインディング防御・#348）。
tokio = { workspace = true, features = ["net"] }
# 内部の送り先の表（internal_hosts）の名前と IP の読み方を URL とそろえる（D-135）。
url = { workspace = true }
# 外への送信の中継（egress_proxy・GAP-72）: Basic 認証の値・トンネルの口を置く 0700 のディレクトリ・管理者向けのログ。
base64 = { workspace = true }
tempfile = "3"
tracing = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
# protoc をシステムに要求しない（CI/開発の再現性）。プラットフォーム別の protoc バイナリを同梱する。
protoc-bin-vendored = "3"

[dev-dependencies]
proptest = { workspace = true }
tokio = { workspace = true }

# prost は tonic 生成コード（OUT_DIR）が `::prost::Message` で使うため machete が誤検出する。
[package.metadata.cargo-machete]
ignored = ["prost"]

[lints]
workspace = true
