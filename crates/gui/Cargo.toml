[package]
name = "shiki-gui"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
version = "0.0.0"

[lib]
name = "gui"

[[bin]]
name = "export-gui-ts"
path = "src/bin/export-ts.rs"

[dependencies]
shiki-authz.workspace = true
shiki-artifact.workspace = true
# 監査（AuditRecorder）は storage の単一実装を共有する。
shiki-storage.workspace = true
# ツール名語彙（skill の allowed_tools）。
shiki-agent-core.workspace = true
# ミニアプリの画面（Yui を含む Markdown）のボタンを読み、送られた値を検証する（#604）。
shiki-yui.workspace = true
# 画面のボタンで起動した run の状態を読む（起動の記録の書き戻し）。
shiki-workflow-engine.workspace = true
# 画面の表（data_grid）の保存ビューをピン版で実行する（Task 15.7・クエリは data のチョークポイント）。
shiki-data.workspace = true
chrono.workspace = true

serde.workspace = true
serde_json.workspace = true
# serde パース失敗の位置（path）を LLM 自己修正/エディタ表示向けに残す。
serde_path_to_error = "0.1"
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }
# ミニアプリの起動の記録（miniapp_action_run）と AuditRecorder の PgPool。
sqlx.workspace = true
async-trait.workspace = true
tracing.workspace = true
# UI アクション監査の params ダイジェスト（本文は監査に残さない）。
sha2 = { workspace = true }
# skill・ミニアプリの本文の型を TS へ生成（codegen が正）。
ts-rs = { workspace = true }
# GuiValidationError を API エラー body スキーマとして公開する。
utoipa.workspace = true

[dev-dependencies]
tokio.workspace = true
sqlx.workspace = true
reqwest.workspace = true

# lib 名 authz/artifact/storage/agent_core で参照するため machete が誤検出する。
[package.metadata.cargo-machete]
ignored = ["shiki-authz", "shiki-artifact", "shiki-storage", "shiki-agent-core", "shiki-yui", "shiki-workflow-engine", "shiki-data"]

[lints]
workspace = true
