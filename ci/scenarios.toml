# E2E の担当シナリオ対応表（#922）。変更ファイルから回す Playwright spec を選ぶ（scripts/ci_scenarios.py）。
#
# 選び方（どれにも当てはまらない変更は E2E を全部回す＝忘れても漏れずに遅くなるだけ）:
#   - web/src/** : import を辿って、その変更が届くページ（page.tsx・layout.tsx 等）を求め、ページが属する
#                  シナリオの spec を回す。部品・lib の対応は import から自動で決まるので、ここには書かない。
#   - crates/**  : 変更したクレートに（推移的に）依存するクレートを求め、それを `crates` に持つシナリオを回す。
#                  API ルート（crates/api）は shiki-api が [all] なので全部回す（ルートを使う spec は import から
#                  辿れず、手で書くと漏れるため）。`paths` はファイル単位で決めたい入力があるときだけ使う。
#   - web/e2e/X.spec.ts : その spec だけを回す（helpers・fixtures は全部）。
#
# 更新が要るとき（quality ジョブの `python3 scripts/ci-select.py check` が落として知らせる）:
#   - E2E spec を足した → その spec が開くページのシナリオの `e2e` に足す
#   - ページ（page.tsx）を足した → そのページを開く spec のシナリオの `pages` に足す（無ければシナリオを作る）
#   - クレートを足した → どこからも依存されないなら `crates`・[all]・[none] のどれかに載せる
#   - spec・ページ・クレートを消した・改名した → ここからも消す（空振りの glob・spec も落とす）
#
# glob は `*` が `/` を跨がず、`**` が跨ぐ。

# 毎回回す spec（ログイン → 保護ページ → ログアウトの最小経路）。
[always]
e2e = ["auth.spec.ts"]

# 変更されたら E2E を全部回すもの（全ページが通る入口・全機能が使う基盤）。
[all]
pages = ["web/src/app/login/page.tsx"]
paths = [
    "web/src/middleware.ts",
    "web/e2e/helpers.ts",
    "web/e2e/fixtures/**",
]
# shiki-api・shiki-authz・shiki-storage・shiki-workflow-engine・shiki-gui は gen:api で web の型と
# 実行時の値（認可語彙・ツール一覧など）を生成するので、変更は import では辿れない形で全ページに届く。
crates = [
    "shiki-api",
    "shiki-authz",
    "shiki-storage",
    "shiki-llm-gateway",
    "shiki-artifact",
    "shiki-workflow-engine",
    "shiki-gui",
]

# E2E の実行環境（compose の shiki-server とその依存）に載らないクレート。変更しても E2E は回さない。
[none]
crates = [
    "shiki-fuse",
    "shiki-jtd",
    "shiki-sandbox-agent-proto",
    "shiki-sandbox-bench",
    "shiki-sandbox-guest-agent",
    "shiki-sandbox-netns",
    "shiki-sandbox-orchestrator",
]

# ホーム（チャットの入力欄）とスレッド。ほとんどのクレートは shiki-chat から依存されるので、ここに届く。
# チャットの部品（アシスタントパネル・選択範囲の AI）は各エディタでも使うので、そのシナリオも shiki-chat を持つ。
[scenario.home]
pages = ["web/src/app/(auth)/page.tsx", "web/src/app/(auth)/c/**"]
crates = ["shiki-chat"]
e2e = [
    "admin-console.spec.ts",
    "agent-full-stack.spec.ts",
    "agent-tools.spec.ts",
    "ai-insights.spec.ts",
    "ai-workflow.spec.ts",
    "chat-mobile.spec.ts",
    "chat-modes.spec.ts",
    "chat.spec.ts",
    "composer-attach-same-name.spec.ts",
    "composer-create.spec.ts",
    "csv-conversation-drafts.spec.ts",
    "custom-instructions.spec.ts",
    "deep-research.spec.ts",
    "drive-ai-save-move.spec.ts",
    "mini-apps.spec.ts",
    "note-conversation-drafts.spec.ts",
    "office-chart-insert.spec.ts",
    "office-conversation-create.spec.ts",
    "office-live-real-llm-deep.spec.ts",
    "office-live-video.spec.ts",
    "queued-message.spec.ts",
    "sheet-swipe.spec.ts",
    "sidebar-mobile.spec.ts",
    "skill-editor.spec.ts",
    "skills.spec.ts",
    "slash-command.spec.ts",
    "slide-conversation-drafts.spec.ts",
    "visual.spec.ts",
    "yui-actions.spec.ts",
    "yui.spec.ts",
]

